image: golang:1.14
pipelines:
  default:
    - parallel:
      - step:
          name: Build and test (v1)
          script:
            - go build

            # Style checks
            - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s v1.43.0
            - ./bin/golangci-lint run

            # Build and test
            - go test -v -cover -race .
      - step:
          name: Build and test (v2)
          script:
            - cd v2
            - go build

            # Style checks
            - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s v1.43.0
            - ./bin/golangci-lint run

            # Build and test
            - go test -v -cover -race .
