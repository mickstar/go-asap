image: golang:1.10
pipelines:
  default:
    - step:
        name: Build, test, and deploy (if master)
        script:
          - mkdir -p ${GOPATH}/src/bitbucket.org/atlassian &&  cp -R $(pwd) ${GOPATH}/src/bitbucket.org/atlassian/go-asap

          # Manage dependencies
          - cd /go/src/bitbucket.org/atlassian/go-asap
          - curl https://glide.sh/get | sh
          - ${GOPATH}/bin/glide install

          # Style checks
          - go get -u github.com/alecthomas/gometalinter
          - ${GOPATH}/bin/gometalinter --install
          - ${GOPATH}/bin/gometalinter --vendor --disable-all --enable=vet --enable=goimports --enable=vetshadow --enable=golint --enable=ineffassign --enable=goconst --tests .

          # Build and test
          - go test -v -cover -race .
