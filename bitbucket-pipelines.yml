image: golang:1.14
pipelines:
  default:
    - step:
        name: Build, test, and deploy (if master)
        script:
          - mkdir -p ${GOPATH}/src/bitbucket.org/atlassian &&  cp -R $(pwd) ${GOPATH}/src/bitbucket.org/atlassian/go-asap

          # Manage dependencies
          - cd /go/src/bitbucket.org/atlassian/go-asap
          - go build

          # Style checks
          - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s v1.33.0
          - ./bin/golangci-lint run

          # Build and test
          - go test -v -cover -race .
