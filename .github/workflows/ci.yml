name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -cover ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: install golangci-lint
        run: GOBIN="$PWD/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: lint
        run: make lint

  oracle:
    # The fixture generator must link the PRE-migration library, not the module
    # under test, or the recorded asap* verdicts become a self-portrait and
    # cannot detect a mis-port. `make parity-oracle` extracts that tree from
    # commit 97f05bd, which needs full history.
    name: parity fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: generator builds against the jose-era library
        run: |
          make parity-oracle
          cd tools/paritygen && go build ./...

      - name: committed verdicts reproduce from the jose-era library
        run: |
          cp testdata/parity/validation.json /tmp/committed-validation.json
          make parity-fixtures
          python3 - <<'PY'
          import json

          fields = ("asapDefaultOK", "asapSigOK", "asapAudienceOK", "asapRolesOK")
          def verdicts(path):
              return [(c["name"],) + tuple(c[f] for f in fields)
                      for c in json.load(open(path))]

          committed = verdicts("/tmp/committed-validation.json")
          fresh = verdicts("testdata/parity/validation.json")
          drift = [(a, b) for a, b in zip(committed, fresh) if a != b]
          assert not drift, f"verdicts are not reproducible: {drift}"
          print(f"reproduced {len(fresh)} case verdict sets from the jose-era library")
          PY
          git checkout -- testdata/parity

  difffuzz:
    # Mints and verifies the same tokens with jose and with this module, then
    # compares every verdict. Like the generator this needs Go <= 1.26 because
    # it imports jose to produce the comparison tokens.
    name: differential fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: differential test
        working-directory: tools/difffuzz
        run: go test ./...

      - name: soak
        working-directory: tools/difffuzz
        run: go run . -n 20000 -seed 1
