name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -cover ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: install golangci-lint
        run: GOBIN="$PWD/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: lint
        run: make lint

  oracle:
    # tools/paritygen is not part of the shipped module: it depends on the
    # retired jose library, which only runs on Go <= 1.26, and exists to freeze
    # the pre-migration behaviour into testdata/parity. This job keeps that
    # generator building so the committed fixtures stay reproducible.
    name: parity generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: build
        working-directory: tools/paritygen
        run: go build ./...

  difffuzz:
    # Mints and verifies the same tokens with jose and with this module, then
    # compares every verdict. Like the generator this needs Go <= 1.26 because
    # it imports jose to produce the comparison tokens.
    name: differential fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: differential test
        working-directory: tools/difffuzz
        run: go test ./...

      - name: soak
        working-directory: tools/difffuzz
        run: go run . -n 20000 -seed 1
